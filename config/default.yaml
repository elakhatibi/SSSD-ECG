seed: 42
device: auto
data:
  leads: 12
  sample_rate: 500
  seconds: 10
  normalization: robust
model:
  latent_dim: 16
  hidden_dim: 128
  backbone: resnet
  lstm_layers: 2
  dropout: 0.1
  classifier_hidden_dim: 64
  inception_kernel_size: 15
  classifier_input: latent
training:
  epochs: 40
  batch_size: 32
  learning_rate: 0.001
  weight_decay: 0.0001
  beta: 0.001
  beta_warmup_epochs: 10
  classification_weight: 1.0
  class_weighting: balanced
  label_smoothing: 0.05
  gradient_clip: 1.0
  augmentation_probability: 0.5
  noise_std: 0.01
  amplitude_scale: 0.05
  time_shift_fraction: 0.01
  lead_dropout_probability: 0.01
  baseline_wander_std: 0.02
  early_stopping_patience: 8
  early_stopping_min_delta: 0.0001
  restore_best_weights: true
  lr_scheduler: none
  minimum_learning_rate: 1.0e-5
discretizer:
  bins: 3
graph:
  max_parents: 3
  equivalent_sample_size: 5.0
  alpha: 1.0
retrieval:
  backend: tfidf
  top_k: 5
  min_score: 1.0e-8
  sentence_model: sentence-transformers/all-MiniLM-L6-v2
  metadata_weight: 0.2
generation:
  backend: template
  model: gpt-4
  temperature: 0.3
  max_tokens: 600
  hallucination_threshold: 0.5
  fuzzy_match_threshold: 0.32
  fallback_to_rag_only: true
