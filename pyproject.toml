[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "care-ecg"
version = "0.1.0"
description = "Reproducible CARE-ECG causal and grounded ECG reasoning pipeline"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "Apache-2.0"}
authors = [{name = "CARE-ECG reproduction contributors"}]
dependencies = [
  "numpy>=1.24",
  "scipy>=1.10",
  "PyYAML>=6.0",
  "torch>=2.1",
]

[project.optional-dependencies]
data = ["pandas>=2.0", "wfdb>=4.1"]
rag = ["sentence-transformers>=2.6"]
openai = ["openai>=1.30"]
local-llm = ["transformers>=4.43", "accelerate>=0.33"]
reports = ["openpyxl>=3.1"]
ensemble = ["scikit-learn>=1.4", "joblib>=1.3"]
dev = ["pytest>=8", "ruff>=0.5"]
all = [
  "pandas>=2.0",
  "wfdb>=4.1",
  "sentence-transformers>=2.6",
  "openai>=1.30",
  "transformers>=4.43",
  "accelerate>=0.33",
  "openpyxl>=3.1",
  "scikit-learn>=1.4",
  "joblib>=1.3",
  "pytest>=8",
  "ruff>=0.5",
]

[project.scripts]
care-ecg = "care_ecg.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
care_ecg = ["assets/*.json", "assets/*.jsonl"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
